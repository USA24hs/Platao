<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Sistema de Deslocamento - Ambulância HCI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --primary: #0e5a77; --primary-dark: #0a3d4f; --bg-body: #f1f5f9; --card-bg: #ffffff; --border: #e2e8f0; --success: #15803d; --danger: #ef4444; --base: #dc2626; --info: #3b82f6; }
        
        body { background: var(--bg-body); font-family: 'Inter', sans-serif; padding: 0.5rem; padding-bottom: calc(70px + env(safe-area-inset-bottom)); overflow-x: hidden; }
        .report-container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 15px -5px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid var(--border); }
        
        /* HEADER COMPACTO */
        .header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); padding: 0.8rem 1rem; color: #fff; transition: all 0.3s ease; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.15); transition: all 0.3s ease; }
        .header-top h1 { font-size: 1.15rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .toggle-header-btn { background: rgba(255,255,255,0.15); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; transition: 0.3s; }
        
        .header-collapsed .toggle-header-btn i { transform: rotate(180deg); }
        .header-collapsed .info-grid { display: none; }
        .header-collapsed .header-top { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .header-collapsed { padding: 0.6rem 1rem; }

        .month-selector { background: rgba(255,255,255,0.1); backdrop-filter: blur(4px); border-radius: 8px; padding: 4px 8px; display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; }
        .month-selector select, .month-selector input { background: #fff; border: none; padding: 2px 6px; border-radius: 6px; font-weight: 700; color: var(--primary-dark); font-family: 'Inter', sans-serif; font-size: 0.8rem; }
        
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.5rem; margin-top: 0.5rem; transition: 0.3s; }
        .info-item { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 6px 10px; }
        .info-item label { font-size: 0.6rem; text-transform: uppercase; opacity: 0.8; display: block; margin-bottom: 2px; letter-spacing: 0.5px; }
        .info-item input, .info-item select { background: rgba(255,255,255,0.95); border: none; padding: 6px 8px; border-radius: 6px; font-weight: 700; color: var(--primary-dark); width: 100%; font-family: 'Inter', sans-serif; font-size: 0.85rem; }
        
        /* CONTEÚDO */
        .content { padding: 0.8rem; overflow-x: hidden; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 0.8rem; margin-bottom: 0.8rem; border: 1px solid var(--border); width: 100%; overflow: hidden; }
        .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--primary-dark); display: flex; align-items: center; gap: 6px; }
        
        /* CAIXA DE LANÇAMENTO (FORMULÁRIO) */
        .form-card { background: #f0fdf4; border: 1px solid #bbf7d0; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; width: 100%; }
        .form-item { display: flex; flex-direction: column; min-width: 0; }
        .form-item.full { grid-column: 1 / -1; }
        .form-item label { font-size: 0.65rem; font-weight: 700; color: #166534; text-transform: uppercase; margin-bottom: 2px; }
        
        .form-item input { 
            width: 100%; min-width: 0; padding: 8px; border-radius: 8px; border: 1px solid #86efac; 
            font-family: 'Inter'; font-size: 0.95rem; font-weight: 600; color: #064e3b; background: #fff; box-sizing: border-box;
        }
        .form-item input:focus { outline: 2px solid #15803d; border-color: transparent; }
        
        .form-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .form-actions button { 
            border: none; color: #fff; padding: 12px 4px; border-radius: 8px; font-weight: 800; cursor: pointer; 
            font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 6px; 
            transition: 0.2s; font-family: 'Inter'; width: 100%;
        }
        
        .btn-form-saida { background: var(--primary); }
        .btn-form-chegada { background: var(--success); }
        .btn-form-retorno { background: #f59e0b; }
        .btn-form-base { background: var(--base); }

        /* TABELA (VISUALIZAÇÃO DO HISTÓRICO) */
        .table-wrapper { overflow-x: auto; margin: 0 -0.5rem; padding: 0 0.5rem; -webkit-overflow-scrolling: touch; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 800px; }
        .log-table th { background: #f8fafc; padding: 8px 4px; border-bottom: 2px solid var(--border); color: #64748b; font-weight: 700; font-size: 0.65rem; text-transform: uppercase; text-align: center; }
        .log-table td { padding: 6px 4px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; text-align: center; font-weight: 500; }
        
        .km-rodado { font-weight: 800; padding: 3px 6px; border-radius: 12px; display: inline-block; font-size: 0.7rem; min-width: 50px; text-align: center; }
        .km-ok { background: #dcfce7; color: #166534; }
        .km-erro { background: #fee2e2; color: #991b1b; }
        
        .btn-del-row { background: none; border: none; color: #cbd5e1; cursor: pointer; padding: 6px; border-radius: 6px; font-size: 0.9rem; transition: 0.2s; }
        .btn-del-row:hover { color: var(--danger); background: #fee2e2; }
        
        /* Botão Bloqueado */
        .btn-del-row.locked { color: #94a3b8; cursor: not-allowed; opacity: 0.5; }
        .btn-del-row.locked:hover { background: none; color: #94a3b8; }

        .total-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 0.8rem; background: #eff6ff; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; color: var(--primary-dark); }
        
        .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
        .obs-box textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-family: 'Inter'; font-size: 0.8rem; resize: vertical; background: #f8fafc; }
        .sign-box { background: #f8fafc; border-radius: 12px; padding: 0.8rem; border: 1px solid var(--border); }
        canvas { border: 1px dashed #cbd5e1; border-radius: 8px; width: 100%; height: 90px; background: #fff; touch-action: none; cursor: crosshair; }
        .sign-actions { display: flex; justify-content: flex-end; margin-top: 2px; }
        .btn-clear { background: none; border: none; color: #64748b; font-size: 0.65rem; cursor: pointer; }
        .legible-name input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); margin-top: 6px; font-size: 0.85rem; }
        
        .btn-pdf { background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; justify-content: center; width: 100%; font-family: 'Inter'; transition: 0.2s; margin-top: 0.5rem; }

        /* MOBILE */
        @media (max-width: 768px) {
            body { padding: 0; background: #fff; }
            .report-container { border-radius: 0; border: none; box-shadow: none; }
            .header { padding: 0.6rem 0.8rem; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
            .header-top h1 { font-size: 1rem; }
            .header-top { margin-bottom: 0.5rem; padding-bottom: 0.5rem; }
            .info-grid { grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px; }
            .info-item { padding: 4px 6px; border-radius: 6px; }
            .info-item label { font-size: 0.55rem; margin-bottom: 1px; }
            .info-item input, .info-item select { padding: 4px 6px; font-size: 0.8rem; border-radius: 4px; }

            .content { padding: 0.5rem; }
            .card { padding: 0.6rem; margin-bottom: 0.5rem; border-radius: 10px; }
            
            .two-cols { grid-template-columns: 1fr; gap: 0.5rem; }
            
            .form-grid { gap: 6px; }
            .form-item label { font-size: 0.6rem; }
            .form-item input { font-size: 16px !important; padding: 6px; }
            .form-actions button { font-size: 0.8rem; padding: 10px 2px; }

            .log-table, .log-table tbody, .log-table tr, .log-table td { display: block; width: 100% !important; min-width: 0 !important; }
            .log-table thead { display: none; }
            .log-table tr { margin-bottom: 0.5rem; border: 1px solid var(--border); border-radius: 10px; padding: 6px; padding-top: 30px; background: #f8fafc; position: relative; }
            .log-table td { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px dashed #e2e8f0; text-align: right; }
            .log-table td:last-child { border-bottom: none; }
            .log-table td::before { content: attr(data-label); font-weight: 700; color: var(--primary-dark); font-size: 0.65rem; text-transform: uppercase; margin-right: 8px; text-align: left; flex-shrink: 0; }
            
            .btn-del-row { position: absolute; top: 4px; right: 4px; background: #fee2e2; color: #b91c1c; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; }
            .btn-del-row.locked { background: #f1f5f9; color: #94a3b8; }
            td:nth-child(9)::before { display: none; } 
            td:nth-child(9) { display: none; }
            
            .btn-pdf { padding: 10px; font-size: 0.85rem; }
        }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 0.8rem; transition: 0.3s; z-index: 11000; opacity: 0; pointer-events: none; max-width: 90vw; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
<div class="report-container">
    <!-- HEADER -->
    <div class="header" id="mainHeader">
        <div class="header-top">
            <h1><i class="fas fa-ambulance"></i> Deslocamento</h1>
            <div style="display:flex; align-items:center; gap:6px;">
                <div class="month-selector"><i class="far fa-calendar-alt"></i><select id="mesSelect"></select><input type="number" id="anoSelect" style="width:55px;" value="2026"></div>
                <button id="toggleHeaderBtn" class="toggle-header-btn"><i class="fas fa-chevron-up"></i></button>
            </div>
        </div>
        <div class="info-grid">
            <div class="info-item"><label>🏥 Unidade</label><input type="text" id="unidadeHeader" value="HCI"></div>
            <div class="info-item"><label>👨‍⚕️ Condutor</label><input type="text" id="condutorHeader" value="Anderson Martins"></div>
            <div class="info-item"><label>⏱️ Plantão</label><select id="plantaoHeader"><option value="SD 12hs">SD 12hs (07h-19h)</option><option value="SN 12hs">SN 12hs (19h-07h)</option><option value="DN 24hs">DN 24hs</option></select></div>
            <div class="info-item"><label>🚑 Ambulância</label><input type="text" id="ambulanciaHeader" value="Ducato"></div>
            <div class="info-item"><label>🔖 Placa</label><input type="text" id="placaHeader" value="RKD-5A25"></div>
            <div class="info-item"><label>🔢 Km Inicial</label><input type="number" id="kmInicialHeader" value="" placeholder="Ex: 62000" step="0.1"></div>
        </div>
    </div>
    
    <!-- CONTEÚDO -->
    <div class="content">
        
        <!-- CAIXA DE LANÇAMENTO -->
        <div class="card form-card">
            <div class="card-title" style="color: #166534;"><i class="fas fa-edit"></i> Novo Lançamento</div>
            <div class="form-grid">
                <div class="form-item">
                    <label>Data</label>
                    <input type="date" id="fData">
                </div>
                <div class="form-item">
                    <label>Hora</label>
                    <input type="time" id="fHora">
                </div>
                <div class="form-item">
                    <label>KM (Odômetro)</label>
                    <input type="number" id="fKm" step="0.1" placeholder="0.0">
                </div>
                <div class="form-item">
                    <label>Plantão</label>
                    <input type="text" id="fPlantaoInfo" readonly style="background:#e2e8f0; color:#64748b; border-color:#cbd5e1;">
                </div>
                <div class="form-item full">
                    <label>Local / Destino</label>
                    <input type="text" id="fLocal" placeholder="🏥 Origem → Destino">
                </div>
            </div>
            
            <div class="form-actions">
                <button class="btn-form-saida" id="btnRegSaida"><i class="fas fa-sign-out-alt"></i> Saída</button>
                <button class="btn-form-chegada" id="btnRegChegada"><i class="fas fa-map-marker-alt"></i> Chegada</button>
                <button class="btn-form-retorno" id="btnRegRetorno"><i class="fas fa-undo-alt"></i> Retorno</button>
                <button class="btn-form-base" id="btnRegBase"><i class="fas fa-home"></i> Base</button>
            </div>
        </div>

        <!-- TABELA (HISTÓRICO) -->
        <div class="card">
            <div class="card-title"><i class="fas fa-list-ol"></i> Histórico de Lançamentos</div>
            <div class="table-wrapper">
                <table class="log-table" id="logTable">
                    <thead><tr><th>Data</th><th>Tipo</th><th>H Saída</th><th>Km Saída</th><th>Local / Destino</th><th>H Chegada</th><th>Km Chegada</th><th>Km Rod.</th><th style="width:40px">Ações</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="total-bar">
                <span><i class="fas fa-tachometer-alt"></i> Total Rodado</span>
                <span><strong id="totalKmValue">0</strong> km</span>
            </div>
        </div>
        
        <div class="two-cols">
            <div class="obs-box card"><div class="card-title"><i class="fas fa-clipboard-list"></i> Observações</div><textarea id="observacao" rows="2" placeholder="Intercorrências..."></textarea></div>
            <div class="sign-box"><div class="card-title"><i class="fas fa-signature"></i> Assinatura</div><canvas id="signCanvas" width="400" height="90" style="width:100%;height:90px;"></canvas><div class="sign-actions"><button class="btn-clear" id="clearCanvasBtn"><i class="fas fa-eraser"></i> Limpar</button></div><div class="legible-name"><input type="text" id="nomeLegivel" placeholder="Nome completo" value="Anderson Martins"></div></div>
        </div>

        <button class="btn-pdf" id="pdfBtn"><i class="fas fa-file-pdf"></i> Gerar Relatório (PDF)</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    (function() {
        // ======================= FUNÇÕES AUXILIARES =======================
        const hoje = () => new Date().toISOString().slice(0,10);
        const getHoraAtual = () => { const now = new Date(); return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`; };
        const formatDateBR = (s) => s ? s.split('-').reverse().join('/') : '';
        const nomeMes = (m) => ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m-1];
        const diasNoMes = (m,a) => new Date(a, m, 0).getDate();
        const showToast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); };

        // Elementos DOM
        const tbody = document.getElementById('tableBody');
        const totalSpan = document.getElementById('totalKmValue');
        const observacaoEl = document.getElementById('observacao');
        const condutorEl = document.getElementById('condutorHeader');
        const unidadeEl = document.getElementById('unidadeHeader');
        const ambulanciaEl = document.getElementById('ambulanciaHeader');
        const placaEl = document.getElementById('placaHeader');
        const plantaoEl = document.getElementById('plantaoHeader');
        const kmInicialEl = document.getElementById('kmInicialHeader');
        const nomeLegivelEl = document.getElementById('nomeLegivel');
        const mesSelect = document.getElementById('mesSelect');
        const anoSelect = document.getElementById('anoSelect');
        const mainHeader = document.getElementById('mainHeader');

        // Elementos do Form
        const fData = document.getElementById('fData');
        const fHora = document.getElementById('fHora');
        const fKm = document.getElementById('fKm');
        const fLocal = document.getElementById('fLocal');
        const fPlantaoInfo = document.getElementById('fPlantaoInfo');

        let registros = []; 

        // Inicialização do seletor de meses
        for(let m = 1; m <= 12; m++) { let opt = document.createElement('option'); opt.value = m; opt.textContent = nomeMes(m).substring(0,3); mesSelect.appendChild(opt); }
        const hojeData = new Date(); mesSelect.value = hojeData.getMonth() + 1; anoSelect.value = hojeData.getFullYear();

        function getPeriodo() { let m = parseInt(mesSelect.value); let a = parseInt(anoSelect.value); return { mes: m, ano: a, min: `${a}-${String(m).padStart(2,'0')}-01`, max: `${a}-${String(m).padStart(2,'0')}-${diasNoMes(m,a)}` }; }
        function atualizarLimitesDatas() { const p = getPeriodo(); fData.min = p.min; fData.max = p.max; }

        // ======================= REGRA DE BLOQUEIO DE EXCLUSÃO =======================
        function isRecordDeletable(record) {
            if (!record.data) return true; 
            
            const [year, month, day] = record.data.split('-');
            let endHour = 19; // Padrão SD (19h)
            let endDayOffset = 0;
            
            const shift = record.shift || 'SD 12hs'; 
            
            if (shift === 'SD 12hs') {
                endHour = 19; 
                endDayOffset = 0;
            } else if (shift === 'SN 12hs') {
                endHour = 7; // Termina no dia seguinte às 07h
                endDayOffset = 1;
            } else if (shift === 'DN 24hs') {
                endHour = 7; // Termina no dia seguinte às 07h (24h depois)
                endDayOffset = 1;
            }
            
            // Cria a data/hora exata do fim do plantão
            const endTime = new Date(year, parseInt(month) - 1, parseInt(day) + endDayOffset, endHour, 0, 0);
            
            // Adiciona 1 hora de tolerância (caso a pessoa esqueça de fechar no horário exato)
            endTime.setHours(endTime.getHours() + 1);
            
            return new Date() < endTime;
        }

        // ======================= AUTO-OCULTAR CABEÇALHO =======================
        function checkAndCollapseHeader() {
            if (window.innerWidth > 768) return;
            if (unidadeEl.value.trim() && condutorEl.value.trim() && ambulanciaEl.value.trim() && placaEl.value.trim() && kmInicialEl.value.trim()) {
                mainHeader.classList.add('header-collapsed');
            }
        }
        [unidadeEl, condutorEl, ambulanciaEl, placaEl, kmInicialEl, plantaoEl].forEach(el => {
            el.addEventListener('blur', checkAndCollapseHeader);
            el.addEventListener('change', checkAndCollapseHeader);
        });
        document.getElementById('toggleHeaderBtn').addEventListener('click', () => { mainHeader.classList.toggle('header-collapsed'); });

        // ======================= ASSINATURA DIGITAL =======================
        const canvas = document.getElementById('signCanvas'); const ctx = canvas.getContext('2d'); let desenhando = false;
        function redimencionarCanvas() { const w = canvas.clientWidth; const h = 90; canvas.width = w; canvas.height = h; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.lineCap = 'round'; }
        window.addEventListener('resize', () => redimencionarCanvas());
        function getCoords(e) { const rect = canvas.getBoundingClientRect(); const sx = canvas.width / rect.width; const sy = canvas.height / rect.height; let cx, cy; if(e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; } else { cx = e.clientX; cy = e.clientY; } return { x: Math.min(Math.max(0, (cx - rect.left) * sx), canvas.width), y: Math.min(Math.max(0, (cy - rect.top) * sy), canvas.height) }; }
        function iniciarDesenho(e) { desenhando = true; const {x,y} = getCoords(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y); ctx.stroke(); e.preventDefault(); }
        function desenhar(e) { if(!desenhando) return; const {x,y} = getCoords(e); ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y); e.preventDefault(); }
        function pararDesenho() { desenhando = false; ctx.beginPath(); saveToLocal(); }
        canvas.addEventListener('mousedown', iniciarDesenho); canvas.addEventListener('mousemove', desenhar); canvas.addEventListener('mouseup', pararDesenho); canvas.addEventListener('touchstart', iniciarDesenho, {passive: false}); canvas.addEventListener('touchmove', desenhar, {passive: false}); canvas.addEventListener('touchend', pararDesenho);
        document.getElementById('clearCanvasBtn').addEventListener('click', () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); saveToLocal(); });
        redimencionarCanvas();

        // ======================= LÓGICA DE NEGÓCIO =======================
        function limparNomeLocal(str) { if (!str) return ''; return str.replace(/🏥/g, '').trim(); }
        
        function getUltimoKmChegada() { 
            const veiculoAtual = `${ambulanciaEl.value.trim()} - ${placaEl.value.trim()}`;
            for(let i = 0; i < registros.length; i++) { 
                if (registros[i].veiculo !== veiculoAtual) continue; 
                if(registros[i].kmChegada) return registros[i].kmChegada; 
                if(registros[i].kmSaida) return registros[i].kmSaida; 
            } 
            return kmInicialEl.value || ''; 
        }

        function getUltimoLocal() {
            const veiculoAtual = `${ambulanciaEl.value.trim()} - ${placaEl.value.trim()}`;
            for (let i = 0; i < registros.length; i++) {
                if (registros[i].veiculo !== veiculoAtual) continue;
                const local = registros[i].local || '';
                if (!local) continue;
                const partes = local.split('→');
                return partes.length >= 2 ? limparNomeLocal(partes[1]) : limparNomeLocal(local);
            }
            return null;
        }

        function prepararFormulario() {
            fData.value = hoje();
            fHora.value = getHoraAtual();
            
            let kmRef = getUltimoKmChegada();
            if (kmRef) fKm.value = kmRef;
            
            const unidade = limparNomeLocal(unidadeEl.value.trim()) || 'HCI';
            const ultimoLocal = getUltimoLocal();
            
            if (!ultimoLocal) {
                fLocal.value = `🏥 ${unidade} → `;
            } else {
                fLocal.value = `🏥 ${ultimoLocal} → `;
            }

            fPlantaoInfo.value = `${plantaoEl.value} | ${unidade}`;
            atualizarLimitesDatas();
        }

        function adicionarRegistro(tipo) {
            const data = fData.value;
            const hora = fHora.value;
            const km = parseFloat(fKm.value);
            let local = fLocal.value.trim();

            if (!hora || isNaN(km)) return showToast('⚠️ Preencha Hora e KM corretamente.');
            if (!local) local = tipo === 'saida' ? `🏥 ${unidadeEl.value} → ` : `→ 🏥 ${unidadeEl.value}`;

            const veiculoAtual = `${ambulanciaEl.value.trim()} - ${placaEl.value.trim()}`;
            const plantaoAtual = plantaoEl.value; // Salva qual plantão estava ativo

            if (tipo === 'saida') {
                registros.unshift({
                    id: Date.now().toString(),
                    data: data,
                    shift: plantaoAtual, // <--- Salva o turno
                    tipo: 'saida',
                    horaSaida: hora,
                    kmSaida: km.toString(),
                    local: local,
                    horaChegada: '',
                    kmChegada: '',
                    veiculo: veiculoAtual
                });
                showToast('🚑 Saída registrada!');
            } 
            else if (tipo === 'chegada' || tipo === 'retorno' || tipo === 'base') {
                const index = registros.findIndex(r => r.veiculo === veiculoAtual && !r.horaChegada);

                if (index !== -1) {
                    registros[index].horaChegada = hora;
                    registros[index].kmChegada = km.toString();
                    
                    if (tipo === 'base') {
                        registros[index].tipo = 'base';
                        const unidade = limparNomeLocal(unidadeEl.value.trim()) || 'HCI';
                        const origem = limparNomeLocal(registros[index].local.split('→')[0]);
                        registros[index].local = `🏥 ${origem} → 🏥 ${unidade}`;
                    } else if (tipo === 'retorno') {
                        registros[index].tipo = 'retorno';
                    } else {
                        registros[index].tipo = 'chegada';
                    }
                    
                    showToast(tipo === 'base' ? '🏥 Retorno à Base!' : '📍 Chegada registrada!');
                } else {
                    registros.unshift({
                        id: Date.now().toString(),
                        data: data,
                        shift: plantaoAtual,
                        tipo: tipo,
                        horaSaida: '',
                        kmSaida: '',
                        local: local,
                        horaChegada: hora,
                        kmChegada: km.toString(),
                        veiculo: veiculoAtual
                    });
                    showToast('📍 Chegada avulsa registrada!');
                }
            }

            salvarERenderizar();
            prepararFormulario();
            if (window.innerWidth <= 768) mainHeader.classList.add('header-collapsed');
        }

        function deletarRegistro(id) {
            const record = registros.find(r => r.id === id);
            if (!record) return;

            if (!isRecordDeletable(record)) {
                return showToast('🔒 Plantão encerrado. Não é possível excluir.');
            }

            if (!confirm('Excluir este lançamento do histórico?')) return;
            registros = registros.filter(r => r.id !== id);
            salvarERenderizar();
            showToast('🗑️ Lançamento excluído');
        }
        window.deletarRegistro = deletarRegistro;

        // ======================= RENDERIZAÇÃO =======================
        function salvarERenderizar() {
            const frotaKms = JSON.parse(localStorage.getItem('frotaKms_hci') || '{}');
            registros.forEach(r => {
                if (r.veiculo) {
                    if (r.kmChegada) frotaKms[r.veiculo] = r.kmChegada;
                    else if (r.kmSaida && !frotaKms[r.veiculo]) frotaKms[r.veiculo] = r.kmSaida;
                }
            });
            localStorage.setItem('frotaKms_hci', JSON.stringify(frotaKms));
            
            let assinatura = ''; try { assinatura = canvas.toDataURL(); } catch(e) {}
            localStorage.setItem('sistemaDeslocamentoHCI_v15', JSON.stringify({ 
                rows: registros, observacao: observacaoEl.value, condutor: condutorEl.value, unidade: unidadeEl.value, 
                ambulancia: ambulanciaEl.value, placa: placaEl.value, plantao: plantaoEl.value, kmInicial: kmInicialEl.value, 
                nomeLegivel: nomeLegivelEl.value, mes: parseInt(mesSelect.value), ano: parseInt(anoSelect.value), assinaturaImg: assinatura 
            }));

            renderizarTabela();
        }

        function renderizarTabela() {
            tbody.innerHTML = '';
            let totalGeral = 0;

            registros.forEach(r => {
                const tr = document.createElement('tr');
                
                let kmRod = 0;
                let kmClass = 'km-ok';
                let kmText = '0.0';
                if (r.kmSaida && r.kmChegada) {
                    let s = parseFloat(r.kmSaida); let c = parseFloat(r.kmChegada);
                    if (c >= s) { kmRod = c - s; kmText = kmRod.toFixed(1); totalGeral += kmRod; } 
                    else { kmText = 'Inválido'; kmClass = 'km-erro'; }
                }

                let labelTipo = '';
                if (r.tipo === 'saida') labelTipo = '🚑 Saída';
                else if (r.tipo === 'base') labelTipo = '🏥 Base';
                else if (r.tipo === 'retorno') labelTipo = '🔄 Retorno';
                else labelTipo = '📍 Chegada';

                // Verifica se pode ou não deletar
                const canDelete = isRecordDeletable(r);
                const btnHtml = canDelete 
                    ? `<button class="btn-del-row" onclick="deletarRegistro('${r.id}')" title="Excluir"><i class="fas fa-trash-alt"></i></button>`
                    : `<button class="btn-del-row locked" title="Plantão encerrado" onclick="deletarRegistro('${r.id}')"><i class="fas fa-lock"></i></button>`;

                tr.innerHTML = `
                    <td data-label="Data">${formatDateBR(r.data)}</td>
                    <td data-label="Tipo">${labelTipo}</td>
                    <td data-label="H Saída">${r.horaSaida || '-'}</td>
                    <td data-label="Km Saída">${r.kmSaida || '-'}</td>
                    <td data-label="Local" style="text-align:left; font-size:0.75rem;">${r.local}</td>
                    <td data-label="H Chegada">${r.horaChegada || '-'}</td>
                    <td data-label="Km Chegada">${r.kmChegada || '-'}</td>
                    <td data-label="Km Rod."><span class="km-rodado ${kmClass}">${kmText}</span></td>
                    <td data-label="Ações">${btnHtml}</td>
                `;
                tbody.appendChild(tr);
            });

            totalSpan.innerText = totalGeral.toFixed(1);
        }

        // ======================= PERSISTÊNCIA =======================
        function carregarLocalStorage() {
            let raw = localStorage.getItem('sistemaDeslocamentoHCI_v15'); 
            if(!raw) {
                prepararFormulario();
                return false;
            }
            try {
                let d = JSON.parse(raw); 
                condutorEl.value = d.condutor || 'Anderson Martins'; unidadeEl.value = d.unidade || 'HCI'; ambulanciaEl.value = d.ambulancia || 'Ducato'; placaEl.value = d.placa || 'RKD-5A25'; plantaoEl.value = d.plantao || 'SD 12hs'; kmInicialEl.value = d.kmInicial || ''; nomeLegivelEl.value = d.nomeLegivel || 'Anderson Martins'; observacaoEl.value = d.observacao || '';
                if(d.mes) mesSelect.value = d.mes; if(d.ano) anoSelect.value = d.ano;
                
                registros = d.rows || [];
                
                if(d.assinaturaImg && d.assinaturaImg !== 'data:,') { 
                    let img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height); img.src = d.assinaturaImg; 
                }
                
                renderizarTabela(); 
                prepararFormulario();
                
                if (window.innerWidth <= 768 && registros.length > 0) mainHeader.classList.add('header-collapsed');
                return true;
            } catch(e) { 
                prepararFormulario();
                return false; 
            }
        }

        // ======================= RELATÓRIO PDF =======================
        async function gerarRelatorio() {
            const btn = document.getElementById('pdfBtn'); btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Gerando...';
            try {
                const dataHora = new Date().toLocaleString('pt-BR'); const assinaturaImg = canvas.toDataURL('image/png'); const mesNome2 = nomeMes(parseInt(mesSelect.value)); const ano = anoSelect.value;
                let linhasHTML = '';
                
                registros.forEach((l, idx) => {
                    let kmR = '0.0'; let kmRodStyle = 'color:#0b8043; font-weight:bold;';
                    if(l.kmSaida && l.kmChegada) {
                        let s = parseFloat(l.kmSaida); let c = parseFloat(l.kmChegada);
                        if(c >= s) kmR = (c-s).toFixed(1); else { kmR = 'Inválido'; kmRodStyle = 'color:#cc0000; font-weight:bold;'; }
                    } else { kmR = '-'; kmRodStyle = 'color:#666;'; }
                    
                    let tipoLabel = '';
                    if (l.tipo === 'saida') tipoLabel = '🚑 SAÍDA';
                    else if (l.tipo === 'base') tipoLabel = '🏥 BASE';
                    else if (l.tipo === 'retorno') tipoLabel = '🔄 RETORNO';
                    else tipoLabel = '📍 CHEGADA';

                    const bg = idx % 2 === 0 ? '#fff' : '#f8f9fa'; 
                    
                    linhasHTML += `<tr style="background:${bg}">
                        <td style="padding:6px; border:1px solid #ddd; text-align:center;">${idx+1}</td>
                        <td style="padding:6px; border:1px solid #ddd; text-align:center;">${formatDateBR(l.data)}</td>
                        <td style="padding:6px; border:1px solid #ddd; text-align:center;">${tipoLabel}</td>
                        <td style="padding:6px; border:1px solid #ddd; text-align:center;">${l.horaSaida || '-'}</td>
                        <td style="padding:6px; border:1px solid #ddd; text-align:right;">${l.kmSaida || '-'}</td>
                        <td style="padding:6px; border:1px solid #ddd; text-align:left;">${l.local}</td>
                        <td style="padding:6px; border:1px solid #ddd; text-align:center;">${l.horaChegada || '-'}</td>
                        <td style="padding:6px; border:1px solid #ddd; text-align:right;">${l.kmChegada || '-'}</td>
                        <td style="padding:6px; border:1px solid #ddd; text-align:right; ${kmRodStyle}">${kmR}</td>
                    </tr>`;
                });
                
                const obsHTML = observacaoEl.value ? `<tr><td colspan="9" style="padding:8px; border:1px solid #ddd; background:#f9f9f9;"><strong>📋 Obs:</strong> ${observacaoEl.value.replace(/\n/g, '<br>')}</td></tr>` : '';
                const totalKm = totalSpan.innerText;

                const relatorioHTML = `
                    <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Relatório 🚑</title>
                    <style>* { margin:0; padding:0; box-sizing:border-box; } body { font-family: Arial, sans-serif; background:#fff; padding:20px; color:#202124; } .container { max-width:1280px; margin:0 auto; } h1 { font-size:18pt; color:#0e5a77; margin-bottom:5px; } .sub { font-size:10pt; color:#5f6368; margin-bottom:20px; border-bottom:1px solid #dadce0; padding-bottom:10px; } .info-table { width:100%; border-collapse:collapse; margin-bottom:20px; font-size:9pt; } .info-table td { padding:6px 10px; border:1px solid #dadce0; } .info-table td:first-child { background:#f1f3f4; font-weight:600; width:15%; } .data-table { width:100%; border-collapse:collapse; margin-bottom:20px; font-size:8.5pt; } .data-table th { background:#f1f3f4; padding:8px 6px; border:1px solid #dadce0; text-align:center; font-weight:700; } .footer { margin-top:30px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid #dadce0; padding-top:20px; } .signature { display:flex; gap:30px; align-items:center; } .signature img { max-height:60px; border:1px solid #ccc; background:#fff; } @media print { body { padding:0; margin:0; } .no-print { display:none; } }</style>
                    </head><body><div class="container">
                        <h1>📄 Relatório de Deslocamento</h1><div class="sub">Controle de Frota · ${mesNome2} / ${ano}</div>
                        <table class="info-table">
                            <tr><td>Condutor</td><td>${condutorEl.value}</td><td>Plantão</td><td>${plantaoEl.value}</td></tr>
                            <tr><td>Ambulância</td><td>${ambulanciaEl.value}</td><td>Placa</td><td>${placaEl.value}</td></tr>
                            <tr><td>Km Inicial</td><td>${kmInicialEl.value || '-'}</td><td>Gerado em</td><td>${dataHora}</td></tr>
                        </table>
                        <table class="data-table"><thead><tr><th>#</th><th>Data</th><th>Tipo</th><th>H Saída</th><th>Km Saída</th><th>Local / Destino</th><th>H Chegada</th><th>Km Chegada</th><th>Km Rod.</th></tr></thead>
                            <tbody>${linhasHTML}<tr style="background:#f1f3f4; font-weight:bold;"><td colspan="8" style="text-align:right;">TOTAL</td><td style="text-align:right;">${totalKm}</td></tr>${obsHTML}</tbody>
                        </table>
                        <div class="footer"><div class="signature"><div>Assinatura:</div><img src="${assinaturaImg}" alt="Assinatura"></div><div><strong>Condutor:</strong> ${nomeLegivelEl.value}</div></div>
                    </div><div class="no-print" style="text-align:center; margin-top:20px;"><button onclick="window.print()" style="padding:10px 20px; font-size:14px;">🖨️ Imprimir PDF</button> <button onclick="window.close()" style="padding:10px 20px; font-size:14px;">❌ Fechar</button></div></body></html>`;
                const win = window.open('', '_blank'); win.document.write(relatorioHTML); win.document.close(); win.focus();
                showToast('✅ PDF Gerado!');
            } catch(err) { showToast('❌ Erro'); } finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-file-pdf"></i> Gerar Relatório (PDF)'; }
        }

        // ======================= EVENTOS =======================
        document.getElementById('btnRegSaida').addEventListener('click', () => adicionarRegistro('saida'));
        document.getElementById('btnRegChegada').addEventListener('click', () => adicionarRegistro('chegada'));
        document.getElementById('btnRegRetorno').addEventListener('click', () => adicionarRegistro('retorno'));
        document.getElementById('btnRegBase').addEventListener('click', () => adicionarRegistro('base'));
        document.getElementById('pdfBtn').addEventListener('click', gerarRelatorio);

        [condutorEl, unidadeEl, ambulanciaEl, placaEl, kmInicialEl, nomeLegivelEl, observacaoEl].forEach(el => { el.addEventListener('input', () => salvarERenderizar()); });
        [plantaoEl, mesSelect, anoSelect].forEach(el => { el.addEventListener('change', () => { atualizarLimitesDatas(); salvarERenderizar(); }); });
        
        ambulanciaEl.addEventListener('change', () => {
            const veiculoKey = `${ambulanciaEl.value.trim()} - ${placaEl.value.trim()}`;
            const frotaKms = JSON.parse(localStorage.getItem('frotaKms_hci') || '{}');
            if (frotaKms[veiculoKey]) kmInicialEl.value = frotaKms[veiculoKey];
            else kmInicialEl.value = '';
            prepararFormulario();
        });

        placaEl.addEventListener('change', () => {
            const veiculoKey = `${ambulanciaEl.value.trim()} - ${placaEl.value.trim()}`;
            const frotaKms = JSON.parse(localStorage.getItem('frotaKms_hci') || '{}');
            if (frotaKms[veiculoKey]) kmInicialEl.value = frotaKms[veiculoKey];
            else kmInicialEl.value = '';
            prepararFormulario();
        });

        window.addEventListener('beforeunload', () => salvarERenderizar());

        // Inicialização
        carregarLocalStorage();
        atualizarLimitesDatas();
    })();
</script>
</body>
</html>
